name: Release workflow
# TODO: send the hash to other repos actions!

on:
  create:
    ref_type: branch
    branches:
      - "Release/**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/Release/')
    env:
      GITHUB_REF: ${{ github.ref_name == '' && '' || github.ref_name }}
    steps:
      - name: Extract semantic version
        id: version
        run: |
          # Strip the leading "Release/"
          # TODO!!! 
          raw="${GITHUB_REF#refs/heads/Release/}"
          # Simple semver regex (allows pre-release and build metadata)
          if [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "version=$raw" >> $GITHUB_OUTPUT
          else
            echo "Invalid semantic version: $raw"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract last commit description
        id: commit
        run: |
          commit_description=$(git log -1 --pretty=format:"%B" | tail -n +2)
          {
          echo "changelog<<EOF"
          echo "$commit_description"
          echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.version }}
        uses: stefanzweifel/git-auto-commit-action@v6.0.1
        with:
          commit_message: "version bump to $TAG"
          tagging_message: "$TAG"

      - name: Zip xcframework
        id: zip_xcframework
        run: |
          set -euo pipefail
          XCFRAMEWORK_PATH="GliaOpenTelemetry.xcframework"
          if [ ! -d "$XCFRAMEWORK_PATH" ]; then
            echo "Error: '$XCFRAMEWORK_PATH' not found at repo root. Ensure the xcframework exists in this branch." >&2
            exit 1
          fi
          ZIP_NAME="GliaOpenTelemetry.xcframework.zip"
          rm -f "$ZIP_NAME"
          zip -r "$ZIP_NAME" "$XCFRAMEWORK_PATH" > /dev/null
          echo "zip_path=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Calculate SHA-256 hash
        id: sha256
        run: |
          set -euo pipefail
          ZIP_FILE="${{ steps.zip_xcframework.outputs.zip_path }}"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Error: zip file '$ZIP_FILE' not found." >&2
            exit 1
          fi
          SHASUM=$(shasum -a 256 "$ZIP_FILE" | awk '{print $1}')
          echo "zip_hash=$SHASUM" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: ncipollo/release-action@v1.18.0
        with:
          tag: "${{ steps.version.outputs.version }}"
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          body: |
            ## Changelog:
            ${{ steps.commit.outputs.changelog }}
          artifacts: |
            GliaOpenTelemetry.xcframework.zip
          generateReleaseNotes: false

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: Release/${{ steps.version.outputs.version }}
          title: "Release/${{ steps.version.outputs.version }}"
          body: |
            ## Changelog:
            ${{ steps.commit.outputs.changelog }}
          draft: false
          delete-branch: false
